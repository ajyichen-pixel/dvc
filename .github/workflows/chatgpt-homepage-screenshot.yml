name: ChatGPT DVC Rich Homepage Screenshot Verification

on:
  push:
    branches:
      - chatgpt-homepage-screenshot-20260825
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.55.0
      - run: node tools/capture-rich-home.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvc-rich-homepage-live-verification
          path: screenshots/
          retention-days: 1
          if-no-files-found: error
