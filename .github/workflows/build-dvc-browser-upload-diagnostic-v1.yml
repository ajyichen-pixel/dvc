name: Build DVC Browser Upload Diagnostic V1

permissions:
  contents: write
  issues: write

on:
  push:
    branches:
      - dvc-upload-guard-native-v1
    paths:
      - 'ci/build-dvc-browser-upload-diagnostic-v1.ps1'
      - '.github/workflows/build-dvc-browser-upload-diagnostic-v1.yml'
      - 'native_host/**'
      - 'extension/manifest.json'
      - 'deploy_native/GET_TEST_BROWSER.ps1'
  workflow_dispatch:

jobs:
  build-diagnostic:
    runs-on: windows-2022
    steps:
      - name: Report build start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2 --repo "${{ github.repository }}" --body "DVC_UPLOAD_DIAG_V1 RUN_ID=${{ github.run_id }} STATUS=STARTED SHA=${{ github.sha }}"

      - name: Checkout DVC repo
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish DVC sanitization host
        shell: pwsh
        run: |
          dotnet publish native_host/DVCUploadGuardHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o build/host
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          & build/host/DVCUploadGuardHost.exe --health
          if ($LASTEXITCODE -ne 0) { throw 'health failed' }
          & build/host/DVCUploadGuardHost.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw 'DOCX sanitization selftest failed' }

      - name: Generate diagnostic package
        shell: pwsh
        run: |
          & ./ci/build-dvc-browser-upload-diagnostic-v1.ps1
          if (-not (Test-Path 'dist_diag\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1\extension\content.js')) { throw 'diagnostic package missing' }

      - name: Verify diagnostic instrumentation
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist_diag\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1'
          foreach ($file in @('INSTALL.cmd','VERIFY.cmd','UNINSTALL.cmd','START_TEST.cmd','DVCUploadGuardHost.exe','native_host_manifest.json','README_FIRST.txt','ENGINE_MARKER.txt','extension\manifest.json','extension\background.js','extension\content.js','extension\page_hook.js')) {
            if (-not (Test-Path (Join-Path $root $file))) { throw "missing $file" }
          }
          $m = Get-Content (Join-Path $root 'extension\manifest.json') -Raw | ConvertFrom-Json
          if ($m.content_scripts.Count -lt 2) { throw 'MAIN/ISOLATED scripts missing' }
          if ($m.content_scripts[0].world -ne 'MAIN') { throw 'MAIN world hook not configured' }
          $content = Get-Content (Join-Path $root 'extension\content.js') -Raw
          foreach ($marker in @('ISOLATED_WORLD_READY','NATIVE_HOST_READY','DYNAMIC_FILE_INPUT_ADDED','Export Diagnostic Log','Force Test Mode','composedPath','pointerdown','CHANGE_REPLAY','UPLOAD_PATH')) {
            if ($content -notmatch [regex]::Escape($marker)) { throw "content marker missing: $marker" }
          }
          $hook = Get-Content (Join-Path $root 'extension\page_hook.js') -Raw
          foreach ($marker in @('MAIN_WORLD_READY','FORMDATA_APPEND','FORMDATA_SET','FETCH_CALL','XHR_SEND','SHOW_OPEN_FILE_PICKER','FORCE_TEST_RESULT','DVC_DIAG_SAFE_MAP')) {
            if ($hook -notmatch [regex]::Escape($marker)) { throw "main-world marker missing: $marker" }
          }
          & (Join-Path $root 'DVCUploadGuardHost.exe') --selftest
          if ($LASTEXITCODE -ne 0) { throw 'packaged host selftest failed' }

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_zip_diag -Force | Out-Null
          Compress-Archive -Path 'dist_diag\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1\*' -DestinationPath 'dist_zip_diag\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1_WINDOWS.zip' -Force
          $zip = Get-Item 'dist_zip_diag\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1_WINDOWS.zip'
          if ($zip.Length -lt 1000000) { throw 'ZIP unexpectedly small' }
          Get-FileHash $zip.FullName -Algorithm SHA256

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1_WINDOWS
          path: dist_diag/DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable diagnostic ZIP on branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item 'dist_zip_diag\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1_WINDOWS.zip' 'release\DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1_WINDOWS.zip' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/DVC_BROWSER_UPLOAD_DIAGNOSTIC_V1_WINDOWS.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Publish DVC Browser Upload Diagnostic V1 ZIP [skip ci]'
            git push origin HEAD:dvc-upload-guard-native-v1
          }

      - name: Report build result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2 --repo "${{ github.repository }}" --body "DVC_UPLOAD_DIAG_V1 RUN_ID=${{ github.run_id }} STATUS=${{ job.status }} SHA=${{ github.sha }}"
