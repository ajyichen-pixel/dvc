<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DVC Upload Guard Test</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f6f8fb;color:#14213d;min-width:360px}
    main{max-width:720px;margin:32px auto;padding:24px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(17,24,39,.08)}
    h1{margin:0 0 6px;font-size:24px} .sub{color:#5b6472;margin-bottom:22px}
    .badge{display:inline-block;background:#fff3e8;color:#9a4b00;border:1px solid #ffd5ad;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .box{border:2px dashed #f48418;border-radius:16px;padding:24px;margin-top:18px;background:#fffaf5}
    input{display:block;margin:14px 0} button{background:#f48418;color:white;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;background:#101828;color:#eaf0ff;padding:14px;border-radius:12px;min-height:84px}
    a{color:#0b63ce;font-weight:700}
  </style>
</head>
<body>
<main>
  <span class="badge">DVC NATIVE TEST V1</span>
  <h1>DVC Upload Guard</h1>
  <div class="sub">Native Messaging + browser upload de-identification test. V1 supports DOCX and common text files up to 512 KB.</div>
  <button id="health">Check native host</button>
  <div class="box">
    <strong>Select a test file</strong>
    <input id="file" type="file">
    <div id="download"></div>
  </div>
  <h3>Result</h3>
  <pre id="result">Ready.</pre>
</main>
<script src="test.js"></script>
</body>
</html>
